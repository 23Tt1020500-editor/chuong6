<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nhà sách Sông Hương{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .topbar { background: #0b3a75; }
    .cart-badge { background: #f76707; }
    .price { color: #e8590c; font-weight: 700; }
  </style>
</head>
<body class="bg-light">
{% import 'macros.html' as m with context %}
<nav class="topbar navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('shop.books') }}">📖 Nhà sách Sông Hương</a>
    <div class="d-flex gap-4">
      <a class="nav-link text-white" href="{{ url_for('shop.books') }}">Sách</a>
      <a class="nav-link text-white" href="{{ url_for('shop.cart') }}">Giỏ hàng
        {% if cart_count %}<span class="badge rounded-pill cart-badge">{{ cart_count }}</span>{% endif %}
      </a>
    </div>
  </div>
</nav>
<main class="container py-4">
  {{ m.flashes() }}
  {% block content %}{% endblock %}
</main>
</body>
</html>
