<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quản trị{% endblock %} · Nhà sách Sông Hương</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .side { width: 220px; background: #1e293b; min-height: 100vh; }
    .side .nav-link { color: #cbd5e1; border-radius: 6px; }
    .side .nav-link.on { background: #0f172a; color: #fff; }
    .price { color: #e8590c; font-weight: 700; }
    .pending-badge { background: #f76707; }
  </style>
</head>
<body class="bg-light">
{% import 'macros.html' as m with context %}
{% set ep = request.endpoint or '' %}
<div class="d-flex">
  <aside class="side p-3 text-white flex-shrink-0">
    <div class="fw-bold">Quản trị</div>
    <small class="text-secondary">Nhà sách Sông Hương</small>
    <nav class="nav flex-column mt-3 gap-1">
      <a class="nav-link {{ 'on' if ep == 'admin.dashboard' }}" href="{{ url_for('admin.dashboard') }}">Tổng quan</a>
      <a class="nav-link {{ 'on' if ep.startswith('admin.book') }}" href="{{ url_for('admin.books') }}">Sách</a>
      <a class="nav-link {{ 'on' if ep.startswith('admin.categor') }}" href="{{ url_for('admin.categories') }}">Danh mục</a>
      <a class="nav-link {{ 'on' if ep.startswith('admin.order') }}" href="{{ url_for('admin.orders') }}">Đơn hàng
        {% if pending_count %}<span class="badge rounded-pill pending-badge">{{ pending_count }}</span>{% endif %}</a>
      <a class="nav-link mt-4" href="{{ url_for('shop.books') }}">← Trang bán hàng</a>
    </nav>
  </aside>
  <main class="flex-grow-1 p-4">
    {{ m.flashes() }}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
